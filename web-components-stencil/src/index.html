<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <link rel="stylesheet" href="/build/web-components-stencil.css" />
    <script type="module" src="/build/web-components-stencil.esm.js"></script>
    <script nomodule src="/build/web-components-stencil.js"></script>
  </head>
  <body class="light">
    <!-- Buttons -->
    <h2>Buttons</h2>
    <sk-button variant="primary" size="sm">Click me</sk-button>
    <sk-button variant="secondary" size="md" loading>Click me</sk-button>
    <sk-button variant="destructive" size="lg" disabled>Click me</sk-button>
    <sk-button variant="ghost" size="lg" full-width>Click me</sk-button>
    <sk-button size="lg" iconOnly>
      <sk-icon name="plus" aria-label="Add"></sk-icon>
    </sk-button>

    <!-- Toggle -->
    <h2>Toggle</h2>
    <sk-toggle label="Theme mode"></sk-toggle>
    <sk-toggle checked label="Dark mode"></sk-toggle>

    <!-- Icons -->
    <h2>Icons</h2>
    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
      <sk-icon name="arrow" size="16" aria-label="Arrow"></sk-icon>
      <sk-icon name="plus" size="24" aria-label="Add"></sk-icon>
      <sk-icon name="close" size="24" aria-label="Close"></sk-icon>
      <sk-icon name="menu" size="24" aria-label="Menu"></sk-icon>
      <sk-icon name="search" size="24" aria-label="Search"></sk-icon>
      <sk-icon name="chevron" size="24" dir="down" aria-label="Chevron down"></sk-icon>
      <sk-icon name="chevron" size="24" dir="up" aria-label="Chevron up"></sk-icon>
      <sk-icon name="chevron" size="24" dir="left" aria-label="Chevron left"></sk-icon>
      <sk-icon name="chevron" size="24" dir="right" aria-label="Chevron right"></sk-icon>
      <sk-icon name="check" size="24" aria-label="Check"></sk-icon>
      <sk-icon name="external" size="24" aria-label="External"></sk-icon>
      <sk-icon name="moon" size="24" aria-label="Moon"></sk-icon>
      <sk-icon name="sun" size="24" aria-label="Sun"></sk-icon>
      <sk-icon name="mail" size="24" aria-label="Mail"></sk-icon>
      <sk-icon name="github" size="24" aria-label="GitHub"></sk-icon>
      <sk-icon name="instagram" size="24" aria-label="Instagram"></sk-icon>
    </div>
    <sk-icon name="chevron" dir="down" size="32"></sk-icon>

    <script type="module">
      
    </script>
  </body>
</html>
